# v2 — corrige a versão anterior deste arquivo, que não funcionou.
#
# O que tinha de errado antes:
#   aptPkgs = ["python3"]
# Faltava o "..." no início do array. Sem ele, o Nixpacks pode não estender
# corretamente a lista (a sintaxe documentada é sempre ["...", "pacote"]),
# e pacotes via apt não têm garantia de sobreviver até o container final em
# execução no Railway — só os pacotes Nix (nixPkgs) têm essa garantia,
# porque viram parte do próprio ambiente do container, não só do passo de
# build. Por isso trocamos para nixPkgs.
#
# O que isso resolve:
# - "python3": o yt-dlp (baixado pelo youtube-dl-exec) é um script Python e
#   precisa de um python3 no sistema pra rodar. Sem isso, !play, !video,
#   !tiktok e !instagram falhavam sempre com:
#   env: 'python3': No such file or directory
# - "ffmpeg": o binário empacotado pelo pacote npm ffmpeg-static ficou
#   confirmado incompleto neste ambiente (não tem o filtro "drawtext"), o
#   que quebrava !attp, !s-, !brat e !meme. Instalar o ffmpeg completo via
#   Nix substitui esse binário incompleto (o código em modulos/midia.js já
#   foi ajustado pra priorizar esse ffmpeg do sistema).
#
# O "..." no início do array é o que garante que isso é ADICIONADO ao que
# o Railway já detecta sozinho pro Node.js (nodejs, npm, etc.) — sem ele,
# a lista poderia ser SUBSTITUÍDA em vez de estendida.

[phases.setup]
nixPkgs = ["...", "python3", "ffmpeg"]
